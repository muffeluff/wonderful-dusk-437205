<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1e7"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>SLIPP.</title><style> *{box-sizing:border-box}body{margin:auto;max-width:760px;background:#f5f1e7;color:#191919;font:15px Arial;padding:20px 20px 100px}header{border-bottom:3px solid;padding-bottom:12px}h1{font:bold 85px Georgia;letter-spacing:-8px;margin:0}em{color:#c52b24;font-style:normal}small{font-weight:bold;letter-spacing:1.5px;text-transform:uppercase}h2{font:bold 34px Georgia;margin:20px 0 8px}h3{font: bold 21px Georgia;margin:5px 0}p{line-height:1.5}nav{position:fixed;bottom:0;left:0;right:0;background:#f5f1e7;border-top:2px solid;display:flex;justify-content:center;padding:12px 0 max(12px,env(safe-area-inset-bottom));gap:5px}button,input,select{font:inherit;padding:10px;border:1px solid #222;background:transparent;color:inherit}button{cursor:pointer}button.active{background:#222;color:white}article{display:flex;gap:14px;border-bottom:1px solid #bcb5a7;padding:15px 0;align-items:start}article img{width:96px;height:96px;object-fit:cover}article div{flex:1}a{color:inherit}form{display:flex;gap:6px}input{min-width:0;flex:1}#status{color:#776e63;font-size:13px}</style><header><small>Uavhengig musikkradar</small><h1>SLIPP<em>.</em></h1><small>Ny musikk. Hver fredag.</small></header><main id="main"></main><nav><button data-tab="home">Forsiden</button><button data-tab="artists">Artister</button><button data-tab="saved">Lagret</button></nav><script>
const main=document.querySelector('main');let tab='home',artists=JSON.parse(localStorage.getItem('artists')||'[]'),saved=JSON.parse(localStorage.getItem('saved')||'[]'),cache=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function store(){localStorage.setItem('artists',JSON.stringify(artists));localStorage.setItem('saved',JSON.stringify(saved))}function item(r){return `<article><img loading="lazy" src="${esc(r.artworkUrl100||r.artworkUrl||'icon.png')}" alt="Albumcover"><div><small><em>${esc(r.releaseDate?.slice(0,10)||'')}</em></small><h3>${esc(r.collectionName||r.name)}</h3>${esc(r.artistName)}<p><a href="https://open.spotify.com/search/${encodeURIComponent(r.artistName+' '+(r.collectionName||r.name))}" target="_blank" rel="noopener">Spotify ↗</a></p></div><button data-save="${esc(r.collectionId||r.id)}">${saved.some(x=>String(x.collectionId||x.id)===String(r.collectionId||r.id))?'✓':'+'}</button></article>`}async function json(url){const r=await fetch(url);if(!r.ok)throw Error('Nettverksfeil');return r.json()}let generation=0;async function render(){const g=++generation;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='saved'){main.innerHTML='<h2>Lytt senere.</h2>'+(saved.map(item).join('')||'<p>Ingen lagrede utgivelser.</p>');return}if(tab==='artists'){main.innerHTML='<h2>Mine artister.</h2><form><input placeholder="Søk etter artist" required><button>Søk</button></form><div id="results"></div>'+artists.map(a=>`<article><div><h3>${esc(a.artistName)}</h3></div><button data-remove="${a.artistId}">Fjern</button></article>`).join('');main.querySelector('form').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#results');out.textContent='Søker…';try{const d=await json('https://itunes.apple.com/search?entity=musicArtist&limit=15&term='+encodeURIComponent(e.target.querySelector('input').value));if(g!==generation)return;out.innerHTML='';for(const a of d.results){const b=document.createElement('button');b.textContent='+ '+a.artistName;b.onclick=()=>{if(!artists.some(x=>x.artistId===a.artistId))artists.push(a);store();render()};out.append(b)}if(!d.results.length)out.textContent='Ingen treff.'}catch{out.textContent='Kunne ikke hente artister.'}};return}main.innerHTML='<h2>Ukens radar.</h2><p>Utgivelser fra artistene du følger, og album på Apples toppliste. Topplisten er ikke et redaksjonelt utvalg.</p><h3>Fra dine artister</h3><div id="personal">Henter…</div><h3>På topplisten</h3><div id="charts">Henter…</div><h3>Redaksjonelle kilder</h3><p><a href="https://www.albumoftheyear.org/releases/">Album of the Year</a> · <a href="https://pitchfork.com/reviews/albums/">Pitchfork</a> · <a href="https://daily.bandcamp.com/">Bandcamp Daily</a></p>';const personal=document.querySelector('#personal'),charts=document.querySelector('#charts');cache=[];if(!artists.length)personal.textContent='Legg til artister under Artister.';else Promise.allSettled(artists.map(a=>json('https://itunes.apple.com/lookup?entity=album&limit=50&id='+a.artistId))).then(ds=>{if(g!==generation)return;const cutoff=Date.now()-7*86400000;const rows=ds.flatMap(d=>d.status==='fulfilled'?d.value.results:[]).filter(r=>r.collectionId&&Date.parse(r.releaseDate)>=cutoff&&Date.parse(r.releaseDate)<=Date.now()).sort((a,b)=>b.releaseDate.localeCompare(a.releaseDate));cache.push(...rows);personal.innerHTML=rows.map(item).join('')||'<p>Ingen treff siste 7 dager.</p>';if(ds.some(d=>d.status==='rejected'))personal.innerHTML+='<p>Noen artister kunne ikke hentes.</p>'});try{const d=await json('https://rss.applemarketingtools.com/api/v2/no/music/most-played/25/albums.json');if(g!==generation)return;const rows=d.feed.results;cache.push(...rows);charts.innerHTML=rows.map(item).join('')}catch{if(g===generation)charts.textContent='Topplisten kunne ikke hentes. Prøv igjen senere.'}}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}if(b.dataset.remove){artists=artists.filter(a=>String(a.artistId)!==b.dataset.remove);store();render()}if(b.dataset.save){const id=b.dataset.save;const i=saved.findIndex(x=>String(x.collectionId||x.id)===id);if(i>=0)saved.splice(i,1);else{const r=cache.find(x=>String(x.collectionId||x.id)===id);if(r)saved.push(r)}store();b.textContent=i>=0?'+':'✓';if(tab==='saved')render()}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></html>
